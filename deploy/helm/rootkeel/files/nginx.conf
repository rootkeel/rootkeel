worker_processes 1;
events { worker_connections 1024; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # No request lines, cookies, body or query parameters in edge logs.
    log_format metadata '$time_iso8601 $status';
    access_log /dev/stdout metadata;
    error_log /dev/stderr crit;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    client_max_body_size 2m;
    server {
        listen 443 ssl default_server;
        server_name _;
        return 421;
    }
    # This environment's hostnames, rendered by the image's envsubst step from
    # templates/rootkeel.conf.template at container start.
    include /etc/nginx/conf.d/rootkeel.conf;
}
