{{- $fullname := include "rootkeel.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "rootkeel.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas | int64 }}
  selector:
    matchLabels:
      {{- include "rootkeel.selector" (list . "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rootkeel.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rootkeel.podCommon" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The stock nginx image, as in Compose: its entrypoint renders the site template from the
        # RT_ variables into conf.d at start. The master process runs as root to bind 443 and read
        # the key; the workers run as nginx.
        - name: proxy
          image: {{ .Values.images.proxy }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: RT_PUBLIC_HOST
              value: {{ .Values.publicHost | quote }}
            - name: RT_RELAY_HOST
              value: {{ .Values.relayHost | quote }}
            - name: RT_HSTS_MAX_AGE
              value: {{ .Values.hstsMaxAge | int64 | quote }}
            - name: NGINX_ENVSUBST_FILTER
              value: ^RT_
          ports:
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/templates/rootkeel.conf.template
              subPath: rootkeel.conf.template
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: rendered
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-proxy
        - name: tls
          secret:
            secretName: {{ include "rootkeel.tlsSecret" . }}
            defaultMode: 0400
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
        - name: rendered
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "rootkeel.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "rootkeel.selector" (list . "proxy") | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.publicPort | int64 }}
      targetPort: https
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort | int64 }}
      {{- end }}
---
# The front door pods' own addresses, for the broker's RT_FRONT_DOOR_HOST. Not a way in.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-proxy-pods
  labels:
    {{- include "rootkeel.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "rootkeel.selector" (list . "proxy") | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
