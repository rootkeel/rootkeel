# Azure: credentials come from the standard AZURE_* variables (AZURE_SUBSCRIPTION_ID with
# AZURE_CLIENT_ID, AZURE_SECRET and AZURE_TENANT), ~/.azure/credentials or an az login session.
- name: Create the resource group
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ rootkeel_azure_resource_group }}"
    location: "{{ rootkeel_azure_location }}"

- name: Create the virtual network
  azure.azcollection.azure_rm_virtualnetwork:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    address_prefixes_cidr:
      - 10.10.0.0/16

- name: Create the subnet
  azure.azcollection.azure_rm_subnet:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    virtual_network: "{{ rootkeel_vm_name }}"
    address_prefix_cidr: 10.10.0.0/24

- name: Create the public address
  azure.azcollection.azure_rm_publicipaddress:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    allocation_method: Static
    sku: Standard
  register: rootkeel_azure_ip

- name: Create the network security group
  azure.azcollection.azure_rm_securitygroup:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    rules:
      - name: ssh
        protocol: Tcp
        destination_port_range: "22"
        source_address_prefix: "{{ rootkeel_ssh_source_cidrs }}"
        access: Allow
        priority: 100
        direction: Inbound
      - name: web
        protocol: Tcp
        destination_port_range: "{{ rootkeel_open_ports }}"
        access: Allow
        priority: 110
        direction: Inbound

- name: Create the network interface
  azure.azcollection.azure_rm_networkinterface:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    virtual_network: "{{ rootkeel_vm_name }}"
    subnet_name: "{{ rootkeel_vm_name }}"
    security_group: "{{ rootkeel_vm_name }}"
    ip_configurations:
      - name: default
        public_ip_address_name: "{{ rootkeel_vm_name }}"
        primary: true

- name: Create the VM
  azure.azcollection.azure_rm_virtualmachine:
    name: "{{ rootkeel_vm_name }}"
    resource_group: "{{ rootkeel_azure_resource_group }}"
    vm_size: "{{ rootkeel_azure_vm_size }}"
    image: "{{ rootkeel_azure_image }}"
    admin_username: "{{ rootkeel_azure_ssh_user }}"
    ssh_password_enabled: false
    ssh_public_keys:
      - path: "/home/{{ rootkeel_azure_ssh_user }}/.ssh/authorized_keys"
        key_data: "{{ rootkeel_ssh_public_key }}"
    network_interface_names:
      - "{{ rootkeel_vm_name }}"
    managed_disk_type: StandardSSD_LRS

- name: Use the VM's address
  ansible.builtin.set_fact:
    rootkeel_vm_ip: "{{ rootkeel_azure_ip.state.ip_address }}"
    rootkeel_vm_ssh_user: "{{ rootkeel_azure_ssh_user }}"
