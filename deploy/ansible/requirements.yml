# The cloud providers' Ansible collections, pinned. Install them with
#   ansible-galaxy collection install -r requirements.yml
# Each collection also needs its provider's Python libraries on the computer that runs Ansible;
# docs/ansible.md lists them.
collections:
  - name: amazon.aws
    version: 12.0.0
  - name: google.cloud
    version: 1.15.0
  - name: azure.azcollection
    version: 4.2.0
  - name: hetzner.hcloud
    version: 7.2.0
  - name: digitalocean.cloud
    version: 1.9.0
